description: >-
  Probe of the standard /.well-known/ discovery paths across every Ortto host.
  Only ortto.com serves a real document: a security.txt carrying a responsible
  disclosure form, contact addresses, policy links and a published bug bounty
  rate table. The API hosts (api.ap3api.com and the MCP hosts on ortto.app)
  answer 403 from the AWS load balancer for every /.well-known/ path, and the
  help center returns its own HTML 404 page.
