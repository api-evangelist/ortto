name: Ortto
kind: company
description: Ortto (formerly Autopilot) is a marketing automation, customer data
  platform (CDP), and analytics product. Its REST API at https://api.ap3api.com/v1
  lets applications create and update people/contacts and accounts, send custom
  activity events, manage tags, retrieve campaign reports, and send transactional
  email and SMS, all authenticated with a custom API key via the X-Api-Key header,
  with EU and AU service endpoints for accounts in those data-residency regions.
  Ortto also runs a first-party hosted MCP server, released in version 1.27
  (December 2025), giving agents a read-heavy surface over campaigns, contacts,
  audiences, reports, schema and knowledge-base content. Ortto publishes no
  machine-readable OpenAPI; the specifications here are scaffolded from its
  help-center API reference. Ortto announced in April 2026 that it is joining
  Canva.
