  binding: partial
  confidence: medium
  note: >-
    Both retrieve contacts with filtering and pagination. POST /person/get
    accepts limit/offset/cursor_id/sort_by_field_id/filter; whether the MCP tool
    exposes the same filter grammar cannot be verified without an authenticated
    tools/list.
- tool: get_campaigns
  category: campaigns
  rest:
  - getCampaignCalendar
  binding: partial
  confidence: medium
  note: >-
    POST /campaign/calendar is the documented "retrieve a list of sent
    campaigns" operation and takes type/state/folder_id/q/sort_order/limit,
    which lines up with the tool's described filtering and pagination.
- tool: get_email_report
  category: reports
  rest:
  - getCampaignReport
  binding: partial
  confidence: medium
  note: >-
    POST /campaign/reports/get returns a campaign or asset report keyed by
    campaign_id/asset_id. The MCP tool is scoped to email specifically.
