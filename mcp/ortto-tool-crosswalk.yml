source: >-
  mcp/ortto-mcp.yml (tool list from help.ortto.com/a-910-ortto-mcp) bound against
  openapi/*.yml operationIds in this repo
description: >-
  Binds each Ortto MCP tool to the REST operation(s) that back it. The binding
  is deliberately conservative: Ortto's MCP server is not a generated wrapper
  over the public REST API, it is a separate agent surface built for reporting
  and content work. Only three of the twenty tools have a clean counterpart in
  the REST operations captured in this repo, and every one of those is a
  partial match rather than a 1:1 wrapper — the MCP tools are read-shaped
  (list/filter/paginate) while the REST endpoints they resemble are POST-bodied
  query calls. Sixteen tools have no public REST counterpart at all: reports,
  schema, brand book, assets and knowledge base are either documented outside
  the operations captured here or exposed only through the MCP surface. The
  reverse gap is just as sharp: every write path in the REST API (person merge,
  person delete, account merge, activity create, transactional email and SMS)
  is absent from the MCP tool list, so an agent on MCP alone cannot mutate
  contacts or send messages.
