    - openapi/ortto-accounts-api-openapi.yml
    - openapi/ortto-activities-api-openapi.yml
    - openapi/ortto-campaigns-api-openapi.yml
    - openapi/ortto-tags-api-openapi.yml
    - openapi/ortto-transactional-api-openapi.yml
    base: https://api.ap3api.com/v1
    gated: false
    note: >-
      Spec is scaffolded in this repo from Ortto's published help-center API
      reference; Ortto does not publish a machine-readable OpenAPI itself.
  graphql:
    endpoint: null
    note: Ortto publishes no GraphQL API.
  mcp:
    url: https://mcp-api-us.ortto.app/mcp
    gated: true
    note: >-
      403 unauthenticated; tools enumerated from provider documentation, so
      parameter-level binding cannot be confirmed against live inputSchemas.
