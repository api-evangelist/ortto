  attributes:
  - name: accounts
    type: array
  - name: merge_by
    type: array
  - name: merge_strategy
    type: integer
- name: Activity
  description: >-
    A custom or system event attributed to a Person (or, since release 1.27, an
    Account). Activities carry an activity definition id and an attribute
