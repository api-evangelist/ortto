description: >-
  Entity graph for the Ortto CDP, derived from the operations and schemas in
  this repo's OpenAPI. The model is deliberately shallow by design: Ortto does
  not expose typed resource objects with nested $refs, it exposes a Person and
  an Account whose attributes are a flat map of field ids (`fields`) resolved
  against the instance schema at runtime. That means the real shape of a Person
  is account-specific and only knowable by calling the schema endpoint — the
  spec cannot describe it, and neither can this artifact. Relationships below
  are the ones the API actually expresses through id-reference fields, not an
  idealized CRM model.
entities:
- name: Person
  aliases:
  - Contact
  description: >-
    The core CDP record. Attributes are a map of field ids to values rather than
    named properties; system field ids are documented separately.
  identifier: contact_id
  id_field_note: >-
    Returned as `id` on contact objects and referenced as `contact_id` on
    webhook payloads and activity feeds.
  schemas:
  - PersonInput
  - PersonMergeRequest
  - PersonMergeResponse
  - PersonGetRequest
  - PersonGetResponse
  operations:
  - mergePeople
  - getPeople
  - getPeopleByIds
  - deletePeople
  attributes:
  - name: fields
    type: object
    description: Map of field ids to values; shape is per-instance.
  - name: location
    type: object
  - name: tags
    type: array
  - name: unset_tags
    type: array
  matching:
    fields:
    - merge_by
    - merge_strategy
    - find_strategy
    description: >-
      Records are matched on up to 3 field ids supplied in merge_by, with
      merge_strategy (1 append only, 2 overwrite, 3 ignore) and find_strategy
      (0 any, 1 sequential, 2 all) governing the write.
- name: Account
