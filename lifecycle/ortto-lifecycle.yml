description: >-
  Ortto runs a product-release lifecycle rather than an API lifecycle. Numbered
  releases (1.21 through 1.30) ship roughly every six to eight weeks with a
  dated public changelog and a public feature-request board, and a Statuspage
  instance publishes real-time and historical availability. What is missing is
  API-specific: there is no published API deprecation policy, no Sunset or
  Deprecation response headers (RFC 8594), no version-support window, and no
  API-level SLA outside enterprise contracts. The HTTP path version has stayed
  v1 across every release captured here. One renaming event is documented and
  visible in the surface: "Organizations" became "Accounts" in release 1.22
  (June 2025), and the API reference still carries both spellings.
versioning:
  api_version: v1
  style: path
  product_releases: numbered (1.21 … 1.30)
  changelog: https://roadmap.ortto.com/changelog
  see_also: changelog/ortto-changelog.yml
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  notice_period: null
  note: >-
    No API deprecation or sunset policy is published. Deprecations that do occur
    are announced in the product changelog prose, not in response headers or a
    dated policy.
  deprecated_operations: []
  deprecated_operations_note: >-
    No operation in openapi/*.yml carries deprecated: true.
