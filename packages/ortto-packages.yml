description: >-
  Ortto's first-party client libraries are mobile and commerce SDKs, not REST
  API wrappers. Ortto publishes no official SDK for its HTTP API (api.ap3api.com
  /v1) in any language registry; the developer documentation shows raw curl and
  HTTP examples only. What Ortto does ship is a Flutter plugin family on pub.dev,
  a native Android push SDK on Maven Central, a native iOS SDK distributed via
  Swift Package Manager (with a deprecated CocoaPods path), and a Magento 2
  connector on Packagist. Every entry below was read from the registry metadata
  endpoint on the generated date. Registry currency is uneven: the Android SDK's
  last Maven Central release (1.8.7) predates a v1.8.8 tag that exists in the
  GitHub repository, and the CocoaPods pod is explicitly a maintenance-only path
  the vendor says will end.
